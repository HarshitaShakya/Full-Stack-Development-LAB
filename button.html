<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover{
            background-color: rgb(55, 16, 194);
            color: rgb(250, 250, 252);
        }
        button:active{
            background-color: rgb(255, 0, 132);
            color: rgb(222, 220, 228);
        }

        a:link{
            text-decoration: none;
            color: rgb(11, 3, 10);
        }
        a:visited{
            color: rgb(81, 248, 92);
        }
        input:checked{
            accent-color: rgb(235, 47, 238);
            box-shadow: 1px 1px 5px rgb(5, 5, 5);
        }
        li:nth-child(3n){
            background-color: rgb(161, 247, 31);
        }
    </style>
</head>
<body>
    <button>Click Me</button>
    <a href="#" >Link</a>
    <input type="checkbox" checked/>
    <input type="checkbox"/>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
    </ul>
</body>
</html>

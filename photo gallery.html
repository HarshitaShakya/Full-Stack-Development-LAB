<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento Gallery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f2f2f2;
    padding:20px;
    font-family:Arial,sans-serif;
}

.container{
    display:grid;
    gap:15px;
    grid-template-columns:repeat(4,1fr);

    grid-template-areas:
    "box1 box1 box2 box3"
    "box1 box1 box4 box4"
    "box5 box6 box7 box8"
    "box9 box10 box11 box12";
}

.box{
    background:#4F46E5;
    color:white;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
    height:150px;
}

/* Make only the first box bigger */
div[style*="box1"]{
    height:315px;
}

/* Mobile View */
@media(max-width:500px){

.container{
    grid-template-columns:repeat(2,1fr);

    grid-template-areas:
    "box1 box2"
    "box3 box4"
    "box5 box6"
    "box7 box8"
    "box9 box10"
    "box11 box12";
}

.box{
    height:120px;
}

/* Reset large box */
div[style*="box1"]{
    height:120px;
}

}

</style>
</head>

<body>

<div class="container">

    <div class="box" style="grid-area:box1;"></div>

    <div class="box" style="grid-area:box2;"></div>

    <div class="box" style="grid-area:box3;"></div>

    <div class="box" style="grid-area:box4;"></div>

    <div class="box" style="grid-area:box5;"></div>

    <div class="box" style="grid-area:box6;"></div>

    <div class="box" style="grid-area:box7;"></div>

    <div class="box" style="grid-area:box8;"></div>

    <div class="box" style="grid-area:box9;"></div>

    <div class="box" style="grid-area:box10;"></div>

    <div class="box" style="grid-area:box11;"></div>

    <div class="box" style="grid-area:box12;"></div>

</div>

</body>
</html>

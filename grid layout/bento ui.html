<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento UI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f4f4;
    padding:20px
}

.container{

    display:grid;
    gap:15px;

    grid-template-columns:repeat(3,1fr);

    grid-template-areas:
    "box1 box1 box2"
    "box1 box1 box3"
    "box4 box5 box5"
    "box6 box7 box8"
    "box9 box9 box8";

}

.box{

    background:rgba(12, 2, 217, 0.862);
    border-radius:10px;
    min-height:120px;

}

/* Give larger boxes more height */
div[style*="box1"]{
    min-height:255px;
}

div[style*="box8"]{
    min-height:255px;
}

@media(max-width:500px){

.container{
    display:grid;
    gap:15px;

    grid-template-columns:repeat(3,1fr);

    grid-template-areas:
    "box1 box2 box3"
    "box4 box5 box6"
    "box7 box8 box9";
}

.box{
    height:180px;
    background:rgba(12, 2, 217, 0.862);
    border-radius:10px;
}

div[style*="box1"],
div[style*="box8"]{
    min-height:120px;
}

}

</style>

</head>

<body>

<div class="container">

    <div class="box" style="grid-area: box1;"></div>

    <div class="box" style="grid-area: box2;"></div>

    <div class="box" style="grid-area: box3;"></div>

    <div class="box" style="grid-area: box4;"></div>

    <div class="box" style="grid-area: box5;"></div>

    <div class="box" style="grid-area: box6;"></div>

    <div class="box" style="grid-area: box7;"></div>

    <div class="box" style="grid-area: box8;"></div>

    <div class="box" style="grid-area: box9;"></div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f2f2f2;
            padding:20px;
        }


        /* ================= DESKTOP ================= */

        .container{
            display:grid;

            grid-template-columns:1fr 3fr;

            grid-template-rows:70px 1fr 150px 60px;

            grid-template-areas:
                "header header"
                "sidebar stats"
                "sidebar bottom"
                "footer footer";

            gap:15px;

            min-height:calc(100vh - 40px);
        }


        /* Common style for all boxes */

        .box,
        .stat{
            background:#9ff1b6;
            border:2px solid #8471b8;
            border-radius:10px;

            display:flex;
            justify-content:center;
            align-items:center;

            font-weight:bold;
        }


        .header{
            grid-area:header;
        }


        /* Vertical Sidebar */

        .sidebar{
            grid-area:sidebar;
        }


        /* Six Stat Cards */

        .stats{
            grid-area:stats;

            display:grid;
            grid-template-columns:repeat(3,1fr);

            gap:15px;
        }


        .stat{
            padding:15px;
        }


        /* Two Bottom Cards */

        .bottom{
            grid-area:bottom;

            display:grid;
            grid-template-columns:1fr 1fr;

            gap:15px;
        }


        .recent{
            background:#9ff1b6;
        }


        .activity{
            background:#9ff1b6;
        }


        .footer{
            grid-area:footer;
        }



        /* ================= TABLET ================= */

        @media(max-width:900px){

            .container{

                grid-template-columns:1fr;

                grid-template-rows:
                    70px
                    70px
                    auto
                    140px
                    60px;

                grid-template-areas:
                    "header"
                    "sidebar"
                    "stats"
                    "bottom"
                    "footer";
            }


            .stats{
                grid-template-columns:repeat(3,1fr);
            }

        }



        /* ================= MOBILE ================= */

        @media(max-width:500px){

            body{
                padding:10px;
            }


            .container{

                grid-template-columns:1fr;

                grid-template-rows:
                    60px
                    60px
                    auto
                    auto
                    50px;

                gap:10px;

                grid-template-areas:
                    "header"
                    "sidebar"
                    "stats"
                    "bottom"
                    "footer";
            }


            /* Stats become single column */

            .stats{
                grid-template-columns:1fr;
                gap:10px;
            }


            .stat{
                min-height:50px;
            }


            /* Bottom cards become vertical */

            .bottom{
                grid-template-columns:1fr;
                gap:10px;
            }


            .recent,
            .activity{
                min-height:70px;
            }

        }

    </style>

</head>


<body>

    <div class="container">


        <!-- HEADER -->

        <div class="box header">
            HEADER
        </div>


        <!-- SIDEBAR -->

        <div class="box sidebar">
            SIDEBAR
        </div>


        <!-- SIX STATS -->

        <div class="stats">

            <div class="stat">
                STAT
            </div>

            <div class="stat">
                STAT
            </div>

            <div class="stat">
                STAT
            </div>

            <div class="stat">
                STAT
            </div>

            <div class="stat">
                STAT
            </div>

            <div class="stat">
                STAT
            </div>

        </div>


        <!-- TWO CARDS -->

        <div class="bottom">

            <div class="box recent">
                RECENT ORDERS
            </div>

            <div class="box activity">
                ACTIVITY
            </div>

        </div>


        <!-- FOOTER -->

        <div class="box footer">
            FOOTER
        </div>


    </div>

</body>

</html>

<style>
    .navbar {
        background-color: #b7c9dc;
        padding: 10px 20px;
        box-shadow: 0 2px 4px rgba(44, 29, 29, 0.1);
    }

    .navbar-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .navbar-brand {
        font-size: 24px;
        font-weight: bold;
        color: #1c036f;
        text-decoration: none;
    }

    .navbar-links {
        display: flex;
        gap: 15px;
    }

    .navbar-link {
        color: #1c036f;
        text-decoration: none;
        font-size: 16px;
    }

    .navbar-link:hover {
        color: #bf22d7;
    }
</style>
<body>
    <header class="navbar">
			<div class="navbar-content">
				<a class="navbar-brand" href="/">Invio</a>
				<nav class="navbar-links">
					<a class="navbar-link" href="/">Home</a>
					<a class="navbar-link" href="/about">About</a>
                    <a class="navbar-link" href="/services">Services</a>
					<a class="navbar-link" href="/contact">Contact</a>
				</nav>
			</div>
		</header>
</body>
</html>

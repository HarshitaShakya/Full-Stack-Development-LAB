<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f2f2f2;
            padding:20px;
        }

        .container{
            display:grid;

            grid-template-columns:1fr 3fr;

            grid-template-rows:80px 1fr 150px 60px;

            grid-template-areas:
                "header header"
                "sidebar main"
                "sidebar cards"
                "footer footer";

            gap:20px;

            min-height:calc(100vh - 40px);
        }

        .box{
            background:#ace6ef;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            border:2px solid #8471b8;
            border-radius:10px;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;
        }

        .header{
            grid-area:header;
        }

        .sidebar{
            grid-area:sidebar;
        }

        .main{
            grid-area:main;
        }

        .cards{
            grid-area:cards;
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        .card{
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            background:#ace6ef;
            border:2px solid #8471b8;
            border-radius:10px;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .footer{
            grid-area:footer;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box header">
            HEADER
        </div>

        <div class="box sidebar">
            SIDEBAR
        </div>

        <div class="box main">
            MAIN CONTENT
        </div>

        <div class="cards">

            <div class="card">
                CARD 1
            </div>

            <div class="card">
                CARD 2
            </div>

        </div>

        <div class="box footer">
            FOOTER
        </div>

    </div>

</body>
</html>

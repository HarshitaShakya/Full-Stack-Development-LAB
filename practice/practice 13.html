<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    display: grid;

    /* 3 columns */
    grid-template-columns: 1fr 1fr 1fr;

    /* Header, middle, footer */
    grid-template-rows: 100px 300px 100px;

    gap: 10px;
}

.header {
    background-color: lightblue;

    /* Header takes all 3 columns */
    grid-column: 1 / 4;

    display: flex;
    justify-content: center;
    align-items: center;
}

.a {
    background-color: lightcoral;

    /* A takes 2 rows */
    grid-row: 2 / 4;

    display: flex;
    justify-content: center;
    align-items: center;
}

.b {
    background-color: aquamarine;

    display: flex;
    justify-content: center;
    align-items: center;
}

.c {
    background-color: lightgreen;

    display: flex;
    justify-content: center;
    align-items: center;
}

.d {
    background-color: lightyellow;

    display: flex;
    justify-content: center;
    align-items: center;
}

.e {
    background-color: plum;

    display: flex;
    justify-content: center;
    align-items: center;
}

.footer {
    background-color: lightgray;

    
    grid-column: 1 / 4;

    display: flex;
    justify-content: center;
    align-items: center;
}

    </style>
</head>
<body>
    
<div class="container">

    <div class="header">HEADER</div>

    <div class="a">A</div>
    <div class="b">B</div>
    <div class="c">C</div>
    <div class="d">D</div>
    <div class="e">E</div>

    <div class="footer">FOOTER</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .heading {
            display: flex;
            justify-content: center;
            align-items: center;
        
        }
        
        .navbar {
            border:4px solid black;
            border-radius:10px;
            display: flex;
            justify-content: space-between;
            align-items:center;
            box-shadow:10px 10px ;
        }

        .circle {
            background-color: grey;
            height: 10px;
            width: 10px;
            border-radius: 50%;
            gap: 10px;
            margin: 10px;

        }

        .icons{
            display: flex;
            justify-content: space-between;
            align-items:center;
        }

        .logo{
            margin:-10px 10px ;
            font-style:sans-serif;
            font-weight: bold;
        }

        input{
            border-radius:10px;
            border-color: red;

        }
    </style>
</head>

<body>
    <div class="heading">
        <h1>Practice</h1>
    </div>

    <div class="navbar">
           
        <div class="logo">
        <p>Wheelydos</p>
        </div>
        
        <div>
            <input type="text">
        </div>

        <div class="icons">
            <div class="circle" style="background-color:aquamarine"></div>
            <div class="circle" style="background-color:rgb(251, 251, 19)"></div>
            <div class="circle" style="background-color:rgb(255, 15, 127)"></div>
        </div>

    </div>
</body>

</html>

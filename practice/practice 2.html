<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d1c8fd;
        }

        .centered {
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        .my {
            margin-bottom: 15px;
        }

        input {
            padding: 10px;
            width: 220px;
            border: 1px solid #080707;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            border-color: #9d6afc;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #8471b8;
            color: white;
            margin-top: 5px;
        }

        .btn:hover {
            background-color: #622ef1;
        }

        .card {
            background-color: white;
            width: 350px;
            height: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    </style>
</head>

<body>

    <section class="centered">

        <div class="card">
            <h1>Log In</h1>

            <form action="">
                <div class="my">
                    <input type="text" placeholder="Username">
                </div>

                <div class="my">
                    <input type="password" placeholder="Password">
                </div>

                <button class="btn" type="submit">Sign in</button>
            </form>
        </div>

    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            outline: 2px solid black;
            display:grid;
            height:500px;
            width:500px;
            grid-template-columns:repeat(3,1fr);
            grid-template-rows:repeat(3,1fr);
        }

        .container>div{
            outline: 2px solid rgb(32, 179, 224);
        }

         #box1{
            grid-column:1/3;
            background-color: rgb(237, 12, 95);
            grid-row:1/3;
            z-index:1;
        }

        #box6{
            grid-column:2/3;
            background-color: rgb(112, 254, 117);
            grid-row:2/3;
            z-index:1;
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
        <div id="box5">5</div>
        <div id="box6">6</div>
    </div>
</body>
        
</html>
